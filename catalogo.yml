name: Atualizar catálogo
on:
  push:
    paths: ["animes/**", "tools/gerar_catalogo.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/gerar_catalogo.py
      - run: |
          git config user.name "catalogo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/animes.json
          git diff --staged --quiet || (git commit -m "Atualiza catálogo" && git push)
